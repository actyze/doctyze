# Machine-executable runbook for HolmesGPT / AI SRE agents.
# This file is consumed by AI SRE tools to triage incidents autonomously.
# Confidence: 🟡 INFERRED. Doctyze drafted this seed; verify and refine.

apiVersion: holmesgpt/v1
kind: Runbook
metadata:
  service: "{{SERVICE_NAME}}"
  alert_name: "{{SERVICE_NAME}}HighErrorRate"

spec:
  description: |
    Triggered when 5xx error rate on {{SERVICE_NAME}} exceeds 1% over 5 minutes.
    Companion to docs/runbooks/high-error-rate.md (human-readable version).

  match:
    labels:
      service: "{{SERVICE_NAME}}"
      severity: "high"

  instructions: |
    1. Check pods/instances are running and healthy.
    2. Pull the last 100 ERROR-level log entries scoped to this service.
    3. Look for recent deploys in the last 2 hours.
    4. Probe each declared downstream dependency.
    5. Report findings — DO NOT take corrective action without human approval.

  read_only: true  # Agent investigates, does not act.
