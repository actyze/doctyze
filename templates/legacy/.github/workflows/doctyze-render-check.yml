# Doctyze drift check — runs on every PR.
#
# Fails the PR if canonical sources in docs/skills/ or docs/runbooks/ have
# been edited but the vendor-specific files (.claude/skills/, .cursor/rules/,
# .github/copilot-instructions.md, .windsurfrules, .holmes/runbooks/) are
# out of sync.
#
# This is the load-bearing guard that keeps the canonical-source-of-truth
# model honest. Without it, contributors can hand-edit a vendor file and the
# canonical source silently drifts.
#
# Modes:
#   - PR check     (this workflow) — strict, blocks merge on drift
#   - Auto-render  (doctyze-render-on-push.yml) — regenerates on push to main
#
# See: https://github.com/actyze/doctyze

name: Doctyze Render Check

on:
  pull_request:
    paths:
      - "docs/skills/**"
      - "docs/runbooks/**"
      - ".doctyze.yaml"
      - ".claude/skills/**"
      - ".cursor/rules/**"
      - ".github/copilot-instructions.md"
      - ".windsurfrules"
      - ".holmes/runbooks/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Doctyze
        run: pip install actyze-doctyze

      - name: Check rendered files are in sync with canonical sources
        run: doctyze render --check
