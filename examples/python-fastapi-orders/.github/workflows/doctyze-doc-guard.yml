# Doctyze Doc Guard — runs alongside your existing PR review agent.
#
# This workflow is NOT a full PR review agent. It does not catch code
# correctness, security, or style issues — those are the job of whatever
# PR review agent you already use (CodeRabbit, Greptile, Qodo, Bito,
# Copilot Code Review, internal copilots, human reviewers).
#
# Doctyze's job is one narrow thing: ensure the canonical documentation
# layer stays in sync with code changes. On every PR it checks:
#
#   1. Does this PR's code change require an update to docs/?
#      (new endpoint → openapi.yaml, new dependency → ADR, new error
#       path → runbook, etc.)
#   2. Does the PR conform to the patterns in docs/skills/?
#   3. Are unit + integration tests for the change present?
#
# It posts these as review comments and (depending on mode) can block
# merge until the doc updates land in the same PR.
#
# It does not replace, conflict with, or duplicate any other PR review
# agent. Run both. They cover different ground.
#
# Modes: warn-only | block-required | block-all
# See: https://github.com/actyze/doctyze

name: Doctyze Doc Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  doc-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Doctyze needs git history for diff analysis

      - name: Doctyze doc-coupling check
        uses: actyze/doctyze-doc-guard-action@v1
        with:
          mode: warn-only
          llm: claude
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          config: .doctyze.yaml
