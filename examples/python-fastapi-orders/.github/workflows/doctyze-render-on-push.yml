# Doctyze auto-render — regenerates vendor files when canonical sources change.
#
# Runs on push to main. If docs/skills/ or docs/runbooks/ changed, it
# re-renders the vendor-specific files (.claude/skills/, .cursor/rules/,
# .github/copilot-instructions.md, .windsurfrules, .holmes/runbooks/) and
# commits the result back to main.
#
# This complements doctyze-render-check.yml: PRs are gated by the check,
# but if a contributor merges canonical-only changes (e.g., via a
# squash-merge that bypasses pre-commit), this workflow keeps the vendor
# files current automatically.
#
# Disable this workflow if your team prefers manual rendering — the
# render-check workflow is the load-bearing safety net.
#
# See: https://github.com/actyze/doctyze

name: Doctyze Auto-Render

on:
  push:
    branches: [main]
    paths:
      - "docs/skills/**"
      - "docs/runbooks/**"
      - ".doctyze.yaml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Doctyze
        run: pip install actyze-doctyze

      - name: Render vendor files from canonical sources
        run: doctyze render

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "doctyze-bot"
            git config user.email "doctyze-bot@users.noreply.github.com"
            git add .claude/ .cursor/ .windsurfrules .github/copilot-instructions.md .holmes/ 2>/dev/null || true
            git commit -m "chore: auto-render vendor files from canonical sources"
            git push
          else
            echo "No vendor-file changes to commit."
          fi
