apiVersion: doctyze/v1
kind: ProjectConfig

stack:
  family: modern
  primary: python

agent_targets:
  - claude       # → .claude/skills/<name>/SKILL.md
  - cursor       # → .cursor/rules/<name>.md
  - copilot      # → .github/copilot-instructions.md
  - holmes       # → .holmes/runbooks/<id>.yaml
  # - windsurf

render:
  commit_generated: true
  github_action: true

pr_review:
  mode: warn-only
  llm: claude
  exclude_paths:
    - "vendor/**"
    - "**/*.generated.*"
    - "tests/**"
  min_suggestion_confidence: 0.6

confidence:
  default_marker: "CONFIRMED"   # hand-authored example, not inferred
