openapi: 3.0.3

info:
  title: orders-api
  version: "1.0.0"
  description: |
    Accepts orders from the storefront. Validates inventory and pricing,
    persists to Postgres, fires an order.placed event.

    Pricing fails open per ADR-0003 — see docs/architecture/decisions/.
  license:
    name: Apache-2.0

servers:
  - url: https://orders.example.com/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local development

paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive

  /orders:
    post:
      summary: Place an order
      operationId: placeOrder
      security:
        - bearerAuth: [orders.write]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Duplicate POSTs within 24h with the same key return the original response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        '400':
          description: Invalid request
        '409':
          description: Insufficient inventory
        '503':
          description: Pricing unavailable and no cached price for SKU (rare; see ADR-0003)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OrderRequest:
      type: object
      required: [sku, qty]
      properties:
        sku:
          type: string
        qty:
          type: integer
          minimum: 1
        customer_id:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
          description: ULID
        sku:
          type: string
        qty:
          type: integer
        price_cents:
          type: integer
        price_source:
          type: string
          enum: [live, cache]
          description: "cache means we fell back per ADR-0003"
        created_at:
          type: string
          format: date-time
