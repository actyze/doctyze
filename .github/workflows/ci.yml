# Doctyze CI — runs on every PR + push to main.
#
# 1. Test the CLI + renderer module (pytest)
# 2. Lint with ruff
# 3. Format check with black
# 4. Smoke-test the worked example: `doctyze render --check`

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e cli/[dev]

      - name: Lint
        run: |
          ruff check cli/
          black --check cli/

      - name: Test
        run: |
          cd cli
          pytest -v

      - name: Drift-check the worked example
        run: |
          doctyze render --check --path=examples/python-fastapi-orders
