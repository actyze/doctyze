name: 🎨 New vendor renderer
description: Request support for a new AI coding tool (Cline, Cody, Aider, etc.).
title: "renderer: <vendor name>"
labels: ["enhancement", "renderer", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Each AI tool reads its own context-file shape. Adding a renderer is
        usually ~30 lines of Python (see `cli/src/doctyze/renderers/cursor.py`
        for a minimal example). Great way to make your first contribution.

  - type: input
    id: vendor
    attributes:
      label: Vendor / tool name
      placeholder: "Cline, Cody, Aider, Continue, Roo Code, …"
    validations:
      required: true

  - type: input
    id: file-format
    attributes:
      label: File / folder format this tool reads
      placeholder: ".clinerules / .cody/instructions.md / etc."
    validations:
      required: true

  - type: textarea
    id: format-details
    attributes:
      label: Format specifics
      description: |
        Link to the tool's docs explaining its rules / skills / context
        file format. If there's a YAML frontmatter shape or a particular
        markdown convention, paste an example.
    validations:
      required: true

  - type: checkboxes
    id: implementation
    attributes:
      label: Would you implement it?
      options:
        - label: "Yes — assign me"
        - label: "I can help review"
        - label: "Just requesting"
