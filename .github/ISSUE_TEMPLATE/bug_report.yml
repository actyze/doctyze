name: 🐛 Bug report
description: Something's broken or behaving unexpectedly.
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in what you can — partial reports
        are still helpful.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect and what did you see instead?
      placeholder: "I ran `doctyze init` on a Python repo and …"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `git clone …`
        2. `pip install actyze-doctyze`
        3. `doctyze init`
        4. Observe …
    validations:
      required: true

  - type: input
    id: doctyze-version
    attributes:
      label: Doctyze version
      description: Output of `doctyze --version` or git commit SHA if running from source.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11"
    validations:
      required: true

  - type: dropdown
    id: stack
    attributes:
      label: Stack you were running Doctyze against
      options:
        - python
        - java-spring
        - node-react
        - go
        - cobol
        - abap
        - ibm-i-rpg
        - vb6
        - dotnet-framework
        - powerbuilder
        - delphi
        - other / not detected

  - type: dropdown
    id: llm
    attributes:
      label: LLM backend
      options:
        - none (noop)
        - claude
        - openai
        - ollama
        - other

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant CLI output. Wrap with triple backticks.
      render: shell

  - type: textarea
    id: extras
    attributes:
      label: Anything else?
      description: Screenshots, related issues, hunches.
