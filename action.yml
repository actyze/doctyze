name: "Doctyze freshness check"
description: "Flag documentation that is stale because its anchored code changed (warn-first)."
branding:
  icon: "book-open"
  color: "blue"
inputs:
  path:
    description: "Path to the repository to check"
    required: false
    default: "."
  fail-on-stale:
    description: "Fail the check (non-zero exit) when docs are stale, to gate a merge. Default 'false' = warn-only (report but pass). See ADR-0006."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install doctyze
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Check documentation freshness
      shell: bash
      # Tip: use actions/checkout with fetch-depth: 0 so git diff sees the base.
      run: |
        if [ "${{ inputs.fail-on-stale }}" = "true" ]; then
          doctyze watch "${{ inputs.path }}" --exit-code
        else
          doctyze watch "${{ inputs.path }}"
        fi
