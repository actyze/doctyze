name: "Doctyze freshness check"
description: "Flag documentation that is stale because its anchored code changed (warn-first)."
branding:
  icon: "book-open"
  color: "blue"
inputs:
  path:
    description: "Path to the repository to check"
    required: false
    default: "."
  fail-on-stale:
    description: "Fail the check (non-zero exit) when docs are stale, to gate a merge. Default 'false' = warn-only (report but pass). See ADR-0006."
    required: false
    default: "false"
  base:
    description: "Git ref to diff against so *committed* PR changes are detected (a fresh checkout has no working-tree diff). For a PR, use `origin/${{ github.base_ref }}`. Requires fetch-depth: 0."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install doctyze
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Check documentation freshness
      shell: bash
      # IMPORTANT: use actions/checkout with `fetch-depth: 0` and set `base` on a PR,
      # or committed changes won't be seen and the check always passes.
      run: |
        args="${{ inputs.path }}"
        [ -n "${{ inputs.base }}" ] && args="$args --base ${{ inputs.base }}"
        [ "${{ inputs.fail-on-stale }}" = "true" ] && args="$args --exit-code"
        doctyze watch $args
