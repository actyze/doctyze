[project]
name = "actyze-doctyze"
version = "0.0.2"
description = "Open-source documentation scaffolder for any codebase — modern or legacy."
readme = "../README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Actyze", email = "opensource@actyze.dev" }]
requires-python = ">=3.11"
keywords = ["documentation", "scaffold", "legacy", "modernization", "agents", "adr", "runbook"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Code Generators",
]

dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.40",
  "openai>=1.40",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
]

[project.scripts]
doctyze = "doctyze.cli:main"

[project.urls]
Homepage = "https://github.com/actyze/doctyze"
Repository = "https://github.com/actyze/doctyze"
Issues = "https://github.com/actyze/doctyze/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctyze"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Run with `pytest --cov=doctyze --cov-report=term-missing` for coverage
# (requires pytest-cov in the dev extras).
